name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Verificações de segurança estáticas (CSP, XSS, segredos, regras)
        run: npm run check
      - name: Testes da lógica (carrinho, prazo, cardápio, pedidos, métricas)
        run: npm test
      - name: Testes das regras do Firestore + integração com os emuladores
        run: npm run test:rules
      - name: Testes de ponta a ponta no navegador
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
